<!--
  Chiro-Fysio exit-intent pop-up
  Plak dit blok in de footer van de site (bijvoorbeeld via WPCode of
  Instellingen -> Aangepaste code). Aanpassingen doe je in src/ en
  daarna draai je ./build.sh opnieuw.
-->
<style>
/*!
 * Chiro-Fysio exit-intent pop-up - vormgeving
 *
 * Uitgangspunt: de pop-up onderbreekt iemand al, dus hij moet rustig en
 * vriendelijk zijn in plaats van luid. Vandaar veel witruimte, één zacht
 * gekleurd icoon als baken, en knoppen met gewicht maar zonder geschreeuw.
 *
 * Alle kleuren en vormen komen uit de variabelen hieronder. Die worden in
 * WordPress overschreven met wat er onder Pop-up instellen staat, dus één
 * kleur wijzigen werkt door in het hele venster.
 */

.cf-exit {
  --cf-primary: #1b6a63;
  --cf-primary-dark: #145049;
  --cf-accent: #e8f3f1;
  --cf-whatsapp: #25d366;
  --cf-text: #17242b;
  --cf-muted: #5c6f78;
  --cf-surface: #ffffff;
  --cf-radius: 14px;
  --cf-btn-radius: 10px;

  /* Standaard neemt de pop-up de letter van de site over. In het dashboard kun
     je daar een eigen letterfamilie voor in de plaats zetten. */
  --cf-font: inherit;

  position: fixed;
  inset: 0;
  z-index: 999999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-family: var(--cf-font);
  -webkit-font-smoothing: antialiased;
}

.cf-exit[hidden] {
  display: none;
}

/* --- Overlay -------------------------------------------------------------- */

/* De overlay krijgt een vleugje van de huisstijlkleur mee in plaats van neutraal
   grijs te zijn. Dat bindt het venster aan de site eronder. */
.cf-exit__overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 90% at 50% 0%,
      color-mix(in srgb, var(--cf-primary) 14%, transparent),
      transparent 70%),
    /* Was 0.52 met een sterke vervaging eroverheen. Dat maakte van een vraag
       een onderbreking: de site verdween achter een donker gordijn. Nu blijft
       de pagina herkenbaar, en dat scheelt in hoe hard het aankomt. */
    rgba(10, 22, 26, 0.34);
  opacity: 0;
  transition: opacity 0.28s ease;
}

/* Vervaging geeft diepte, maar alleen waar de browser het aankan. */
@supports (backdrop-filter: blur(2px)) {
  .cf-exit__overlay {
    backdrop-filter: blur(2px);
  }
}

.cf-exit.is-open .cf-exit__overlay {
  opacity: 1;
}

/* --- Het venster ---------------------------------------------------------- */

.cf-exit__dialog {
  position: relative;
  width: 100%;
  max-width: 424px;
  max-height: calc(100vh - 48px);
  overflow-y: auto;
  padding: 38px 34px 30px;
  border-radius: var(--cf-radius);
  background: var(--cf-surface);
  color: var(--cf-text);
  text-align: center;

  /* Gelaagde schaduw: een korte voor de rand, een lange voor de diepte, en een
     haarlijn erbovenop zodat het venster ook op wit blijft staan. */
  box-shadow:
    0 0 0 1px rgba(23, 36, 43, 0.06),
    0 2px 6px rgba(23, 36, 43, 0.06),
    0 18px 40px -12px rgba(23, 36, 43, 0.28);

  opacity: 0;
  transform: translateY(18px) scale(0.97);
  /* Een lichte veer aan het eind: komt vriendelijker binnen dan een rechte lijn. */
  transition:
    opacity 0.3s ease,
    transform 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.08);
}

.cf-exit.is-open .cf-exit__dialog {
  opacity: 1;
  transform: none;
}

/* --- Sluitknop ------------------------------------------------------------ */

/* Bewust bescheiden: wie weg wil moet dat makkelijk kunnen, maar de knop hoeft
   niet om aandacht te vragen. */
.cf-exit__close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--cf-muted);
  opacity: 0.65;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease, opacity 0.18s ease;
}

.cf-exit__close:hover,
.cf-exit__close:focus-visible {
  background: var(--cf-accent);
  color: var(--cf-text);
  opacity: 1;
}

/* --- Logo ------------------------------------------------------------------ */

.cf-exit__logo {
  display: block;
  width: auto;
  max-width: 58%;
  margin: 0 auto 20px;
  object-fit: contain;
}

/* --- Het baken bovenaan ----------------------------------------------------- */

/* Eén zachte cirkel met een icoon erin. Per scherm een ander icoon, zodat je in
   een oogopslag ziet waar je bent: een vraag, een bevestiging, of hulp. */
.cf-exit__mark {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: var(--cf-accent);
  color: var(--cf-primary);
  /* Een zachte ring eromheen geeft het wat lucht. */
  box-shadow: 0 0 0 8px color-mix(in srgb, var(--cf-accent) 45%, transparent);
}

.cf-exit__mark svg {
  width: 26px;
  height: 26px;
}

/* Het vinkje bij "gelukt" verdient net wat meer nadruk. */
.cf-exit__mark--goed {
  background: var(--cf-primary);
  color: #fff;
  box-shadow: 0 0 0 8px color-mix(in srgb, var(--cf-primary) 14%, transparent);
}

/* --- Tekst ---------------------------------------------------------------- */

.cf-exit__title {
  margin: 0 0 9px;
  font-size: 1.52rem;
  line-height: 1.22;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--cf-text);
  text-wrap: balance;
}

.cf-exit__body {
  /* Niet te breed: regels van ruim 40 tekens lezen op deze afstand het prettigst. */
  max-width: 34ch;
  margin: 0 auto 24px;
  font-size: 1.02rem;
  line-height: 1.58;
  color: var(--cf-muted);
}

.cf-exit__note {
  margin: 18px 0 0;
  font-size: 0.85rem;
  line-height: 1.5;
  color: var(--cf-muted);
  opacity: 0.85;
}

/* Bellen en WhatsApp op één regel onder de knoppen.
   Beide stonden hier ooit als grote knop. De belknop kreeg in 30 dagen nul
   kliks, en WhatsApp staat al permanent op de site via de chatknop - dus geen
   van beide verdient het om de aandacht op te eisen. Wie ze zoekt, vindt ze. */
.cf-exit__direct {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 10px;
  margin: 18px 0 0;
  font-size: 0.92rem;
  color: var(--cf-muted);
}

.cf-exit__direct a {
  display: inline-flex;
  align-items: center;
  /* 44px, ook al is dit een bescheiden regel. De richtlijn staat 24 toe, maar
     een deel van de bezoekers is op leeftijd en tikt met een duim op een
     telefoon. Die paar pixels kosten de rust op dit scherm niet. */
  min-height: 44px;
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 600;
  color: var(--cf-primary);
  text-decoration: none;
  transition: color 0.15s ease, background 0.15s ease;
}

.cf-exit__direct a:hover,
.cf-exit__direct a:focus-visible {
  color: var(--cf-primary-dark);
  background: var(--cf-accent);
}

.cf-exit__direct a:focus-visible {
  outline: 3px solid var(--cf-primary);
  outline-offset: 2px;
}

/* Geen scheidingsteken tussen de links: zodra de regel afbreekt, komt zo'n
   teken los aan het begin van de volgende regel te staan. De ruimte ertussen
   doet het werk. */

/* Een omlijnde knop: minder gewicht dan de hoofdknop, meer dan een grijze.
   Precies wat het terugbelverzoek nodig heeft - het is niet de eerste keuze,
   maar wel een echte, en als vlakke grijze knop onderaan werd hij simpelweg
   niet gezien. */
.cf-exit__btn--outline {
  background: transparent;
  color: var(--cf-primary);
  box-shadow: inset 0 0 0 2px var(--cf-primary);
}

.cf-exit__btn--outline:hover,
.cf-exit__btn--outline:focus-visible {
  background: var(--cf-accent);
  color: var(--cf-primary-dark);
  box-shadow: inset 0 0 0 2px var(--cf-primary-dark);
}

/* --- Terugbelformulier ------------------------------------------------------ */

.cf-exit__form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: left;
}

.cf-exit__veld {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.cf-exit__label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--cf-muted);
}

.cf-exit__form input[type="text"],
.cf-exit__form input[type="tel"] {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1.5px solid color-mix(in srgb, var(--cf-muted) 35%, transparent);
  border-radius: var(--cf-btn-radius);
  background: var(--cf-surface);
  color: var(--cf-text);
  font-family: var(--cf-font);
  font-size: 1rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.cf-exit__form input:focus {
  outline: none;
  border-color: var(--cf-primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--cf-primary) 20%, transparent);
}

/* Het lokvak voor invulrobots. Uit beeld, maar niet met display:none - dat
   slaan sommige robots juist over. Ook uit de voorleesvolgorde gehaald, zodat
   een schermlezer er niet over struikelt. */
.cf-exit__val {
  position: absolute;
  left: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

.cf-exit__fout {
  margin: 0;
  padding: 9px 12px;
  border-radius: 8px;
  background: rgba(190, 60, 45, 0.1);
  color: #9c2f22;
  font-size: 0.88rem;
  line-height: 1.45;
}

.cf-exit__fout[hidden] { display: none; }

.cf-exit__form button[disabled] {
  opacity: 0.6;
  cursor: progress;
}

/* --- Knoppen -------------------------------------------------------------- */

.cf-exit__actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.cf-exit__actions--stack {
  flex-direction: column;
}

.cf-exit__btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex: 1 1 auto;
  min-height: 52px;
  padding: 14px 22px;
  border: 0;
  border-radius: var(--cf-btn-radius);
  font-size: 1rem;
  font-weight: 600;
  font-family: var(--cf-font);
  line-height: 1.2;
  letter-spacing: -0.005em;
  text-decoration: none;
  cursor: pointer;
  transition:
    background 0.18s ease,
    color 0.18s ease,
    box-shadow 0.18s ease,
    transform 0.14s ease;
}

/* Zonder deze regel blijft een verborgen knop gewoon staan: de display uit de
   regel hierboven wint van de standaard die de browser aan [hidden] geeft.
   Dat kostte me een scherm waarop twee hoofdknoppen tegelijk stonden. */
.cf-exit__btn[hidden] {
  display: none;
}

/* Een knop die iets omhoog komt voelt aanraakbaar. */
.cf-exit__btn:hover {
  transform: translateY(-1px);
}

.cf-exit__btn:active {
  transform: translateY(0);
}

/* De hoofdknop draagt de huisstijlkleur, met een schaduw in diezelfde kleur
   zodat hij op de kaart lijkt te liggen in plaats van erop geplakt. */
.cf-exit__btn--primary {
  background: var(--cf-primary);
  color: #fff;
  box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--cf-primary) 55%, transparent);
}

.cf-exit__btn--primary:hover,
.cf-exit__btn--primary:focus-visible {
  background: var(--cf-primary-dark);
  color: #fff;
  box-shadow: 0 6px 16px -4px color-mix(in srgb, var(--cf-primary) 60%, transparent);
}

/* De nevenknop: geen harde rand, maar een zachte vlek. Rustiger, en het verschil
   met de hoofdknop wordt er juist duidelijker door. */
.cf-exit__btn--ghost {
  background: color-mix(in srgb, var(--cf-muted) 9%, transparent);
  color: var(--cf-text);
}

.cf-exit__btn--ghost:hover,
.cf-exit__btn--ghost:focus-visible {
  background: var(--cf-accent);
  color: var(--cf-text);
}

.cf-exit__btn--call {
  background: var(--cf-primary);
  color: #fff;
  font-size: 1.06rem;
  box-shadow: 0 2px 8px -2px color-mix(in srgb, var(--cf-primary) 55%, transparent);
}

.cf-exit__btn--call:hover,
.cf-exit__btn--call:focus-visible {
  background: var(--cf-primary-dark);
  color: #fff;
  box-shadow: 0 6px 16px -4px color-mix(in srgb, var(--cf-primary) 60%, transparent);
}

.cf-exit__btn--whatsapp {
  background: var(--cf-whatsapp);
  color: #fff;
  box-shadow: 0 2px 8px -2px rgba(37, 211, 102, 0.5);
}

.cf-exit__btn--whatsapp:hover,
.cf-exit__btn--whatsapp:focus-visible {
  background: #1fb857;
  color: #fff;
  box-shadow: 0 6px 16px -4px rgba(37, 211, 102, 0.55);
}

.cf-exit__icon {
  width: 20px;
  height: 20px;
  flex: none;
}

/* Zichtbare focus voor toetsenbordgebruikers. */
.cf-exit__btn:focus-visible,
.cf-exit__close:focus-visible {
  outline: 3px solid var(--cf-primary);
  outline-offset: 3px;
}

/* --- Achtergrond niet mee laten scrollen ---------------------------------- */

body.cf-exit-lock {
  overflow: hidden;
}

/* --- Mobiel --------------------------------------------------------------- */

/* Op een telefoon wordt het een blad dat van onderen opkomt: dat is waar de duim
   is, en het voelt minder als een blokkade dan een venster midden op het scherm. */
@media (max-width: 560px) {
  .cf-exit {
    padding: 0;
    align-items: flex-end;
  }

  .cf-exit__dialog {
    max-width: none;
    max-height: 92vh;
    padding: 26px 22px calc(26px + env(safe-area-inset-bottom));
    border-radius: calc(var(--cf-radius) + 8px) calc(var(--cf-radius) + 8px) 0 0;
    transform: translateY(100%);
    transition:
      opacity 0.24s ease,
      transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.02);
  }

  /* Het greepje bovenaan: hetzelfde teken dat je in apps ziet, zodat meteen
     duidelijk is dat dit blad hoort weg te kunnen. */
  .cf-exit__dialog::before {
    content: "";
    display: block;
    width: 38px;
    height: 4px;
    margin: 0 auto 18px;
    border-radius: 99px;
    background: color-mix(in srgb, var(--cf-muted) 28%, transparent);
  }

  .cf-exit__close {
    top: 16px;
    right: 12px;
  }

  .cf-exit__mark {
    width: 50px;
    height: 50px;
    margin-bottom: 15px;
  }

  .cf-exit__mark svg {
    width: 23px;
    height: 23px;
  }

  .cf-exit__title {
    font-size: 1.34rem;
  }

  .cf-exit__body {
    font-size: 0.99rem;
    margin-bottom: 20px;
  }

  /* Ja/nee onder elkaar. Bij "heeft u gevonden wat u zocht?" staat "nee, nog
     niet" onderaan, in de duimzone: dat is de knop die naar hulp leidt en ook
     als hoofdknop is vormgegeven. Stond die bovenaan, dan lag juist "ja,
     gelukt" - het wegtikken - het handigst, en dat kost je precies de
     gesprekken waar het om begonnen was.

     Voor wie er al eerder was luidt de vraag "kunnen we u ergens mee helpen?",
     en dan is "ja graag" de knop naar hulp. Ja blijft bovenaan staan, dus daar
     ligt de hoofdknop hoger; de kleur doet dan het werk.

     Alleen voor deze twee knoppen; de hulpknoppen staan al onder elkaar in de
     goede volgorde, met de afspraak bovenaan. */
  .cf-exit__actions:not(.cf-exit__actions--stack) {
    flex-direction: column;
  }
}

/* --- Toegankelijkheid ----------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .cf-exit__overlay,
  .cf-exit__dialog,
  .cf-exit__btn,
  .cf-exit__close,
  .cf-exit__direct a {
    transition: none;
  }

  .cf-exit__dialog {
    transform: none;
  }

  .cf-exit__btn:hover {
    transform: none;
  }
}

/* In hoogcontrastmodus vervangen randen wat de kleuren normaal doen. */
@media (forced-colors: active) {
  .cf-exit__dialog {
    border: 1px solid CanvasText;
  }

  .cf-exit__btn {
    border: 1px solid ButtonText;
  }
}
</style>
<script>
/*!
 * Chiro-Fysio exit-intent pop-up
 * -----------------------------------------------------------------------------
 * Vraagt bezoekers die de site dreigen te verlaten of ze gevonden hebben wat ze
 * zochten. Zo niet, dan tonen we het telefoonnummer en (optioneel) WhatsApp.
 *
 * Geen dependencies, geen tracking cookies. De enige opslag is een
 * localStorage-sleutel om te onthouden dat we de pop-up al getoond hebben,
 * zodat we niemand twee keer lastigvallen.
 */
(function () {
  'use strict';

  /* ==========================================================================
     STANDAARDWAARDEN

     In WordPress hoef je hier niets te wijzigen: alles is aan te passen onder
     Exit-pop-up -> Pop-up instellen. Wat daar is opgeslagen wordt hieronder
     overheen gelegd. Deze waarden gelden dus alleen als terugval, en op de
     demo- en testpagina's die buiten WordPress draaien.
     ========================================================================== */
  var DEFAULTS = {
    // Telefoonnummer van de praktijk, zoals de bezoeker het te zien krijgt.
    // Bevestigd door de praktijk: 024-3558830.
    phoneDisplay: '024 - 355 88 30',

    // Hetzelfde nummer, maar met de landcode in plaats van de nul en zonder
    // spaties. Dat is wat de belknop gebruikt, zodat hij ook werkt als iemand
    // vanaf een mobiel of vanuit het buitenland belt.
    phoneHref: '+31243558830',

    // WhatsApp-nummer van de praktijk, in internationaal formaat zonder + en
    // zonder spaties. Dit is 06-14798722. Laat leeg ('') om de knop te
    // verbergen; een vast 024-nummer werkt namelijk niet op WhatsApp.
    whatsapp: '31614798722',

    // Tekst die alvast in het WhatsApp-bericht staat.
    whatsappText: 'Hallo, ik heb een vraag naar aanleiding van jullie website.',

    // Optionele knop "Direct een afspraak maken" in het ja-scherm.
    // Laat leeg om die knop te verbergen.
    appointmentUrl: '/uw-afspraak/',

    // Hoe lang de bezoeker minimaal op de site moet zijn voordat we de
    // pop-up scherp zetten (milliseconden). Voorkomt dat iemand die per
    // ongeluk klikt meteen een pop-up krijgt.
    //
    // Op 6 seconden gezet op basis van het Analytics-rapport van juli 2026:
    // bezoekers zijn gemiddeld 38 seconden actief en bekijken 1,98 pagina's,
    // dus grofweg 19 seconden per pagina. Met 8 seconden wachten was een
    // ruime derde van dat venster al voorbij voordat we begonnen te kijken.
    armAfterMs: 6000,

    // Hoe lang we na het vertreksignaal wachten voordat de pop-up verschijnt.
    // Komt de aanwijzer binnen die tijd terug in het venster, dan was het geen
    // vertrek maar een greep naar het menu bovenaan, en gebeurt er niets.
    //
    // Dit is de belangrijkste rem tegen een vervelende pop-up: het menu van de
    // site staat bovenaan, dus bezoekers bewegen daar constant naartoe en
    // schieten er soms voorbij. Een echte vertrekker komt niet terug.
    exitGraceMs: 400,

    // Wacht met scherpzetten tot de bezoeker iets gedaan heeft: bewegen,
    // scrollen, tikken of typen. Een echte bezoeker doet dat altijd binnen een
    // paar seconden; een geautomatiseerde bezoeker laadt de pagina en blijft
    // stilzitten. Dat scheelt vervuiling in het dashboard - in juli kwam 31%
    // van het verkeer uit landen zonder plausibele patiëntrelatie.
    requireInteraction: true,

    // Hoeveel dagen we iemand met rust laten nadat de pop-up getoond is.
    // Blijft op 7: van de bezoekers is 92% nieuw en vrijwel niemand komt terug,
    // dus deze grens raakt in de praktijk bijna niemand.
    cooldownDays: 7,

    // Pop-up ook op mobiel/tablet tonen? Daar bestaat geen muis, dus we
    // gebruiken een andere trigger (zie mobileIdleMs / snel omhoog scrollen).
    enableMobile: true,

    // Mobiel: na hoeveel milliseconden zonder enige interactie we de pop-up
    // tonen. Zet op 0 om deze trigger uit te schakelen.
    mobileIdleMs: 45000,

    // Pagina's waar de pop-up NOOIT moet verschijnen. Een term hoeft maar
    // ergens in het pad voor te komen, dus 'afspraak' dekt in één keer
    // '/uw-afspraak/', '/afspraak-chiro/', '/afspraak-fysio/' én
    // '/je-1e-afspraak/'. Schrijf de termen zonder schuine streep: '/afspraak'
    // zou '/je-1e-afspraak/' juist missen, omdat daar '-afspraak' staat.
    //
    // Deze lijst komt uit het Analytics-rapport, nagelopen door de praktijk.
    // Weggehaald: 'winkelwagen' en 'checkout', want die pagina's bestaan niet
    // (geen webshop, omzet 0). 'vacature' dekt /vacatures/: wie naar werk
    // zoekt, heeft niets aan de vraag of die gevonden heeft wat die zocht.
    //
    // Let op: het online boekingssysteem (Crossuite) staat op een ander domein,
    // dus daar draait dit script van zichzelf al niet.
    excludePaths: [
      'contact',
      'afspraak',
      'bedankt',
      'vacature'
    ],

    // Optionele hulplink onderin het nee-scherm, voor de vraag die het vaakst
    // onbeantwoord blijft. Uit het rapport: 18% van de zoekopdrachten op de
    // site zelf gaat over kosten, tarieven of vergoeding, terwijl die
    // informatie verspreid staat over zeven pagina's die samen maar 2,5% van
    // alle weergaven halen. Laat leeg om de link te verbergen.
    helpUrl: '/kosten-en-vergoedingen/',
    // Was een vraagzin toen dit nog een klein tekstlinkje onderaan was. Nu het
    // een knop is, hoort er een handeling op te staan.
    helpLabel: 'Kosten en vergoeding bekijken',

    // Vanaf het hoeveelste bezoek we iemand als terugkerend behandelen.
    // Zet op 0 om geen onderscheid te maken.
    //
    // Let op wat het rapport hierover zegt: 92% van de bezoekers is nieuw en de
    // retentie is vrijwel nul (van de 231 tot 599 bezoekers per week kwamen er

        //
        // Twee velden, meer niet. We vragen met opzet niet waar de vraag over
        // gaat: zou iemand daar een klacht invullen, dan staat er een
        // gezondheidsgegeven in de database van een marketingtool. Het
        // onderwerp kennen we al grofweg uit de vorige stap.
        '<div class="cf-exit__step" data-step="callback" hidden>' +
          baken('bellen') +
          '<h2 class="cf-exit__title">' + t.callbackTitle + '</h2>' +
          '<p class="cf-exit__body">' + t.callbackBody + '</p>' +
          '<form class="cf-exit__form" data-cf="callback-form" novalidate>' +
            '<label class="cf-exit__veld">' +
              '<span class="cf-exit__label">' + t.callbackName + '</span>' +
              '<input type="text" name="naam" autocomplete="name" required>' +
            '</label>' +
            '<label class="cf-exit__veld">' +
              '<span class="cf-exit__label">' + t.callbackPhone + '</span>' +
              '<input type="tel" name="telefoon" autocomplete="tel" inputmode="tel" required>' +
            '</label>' +
            // Onzichtbaar voor mensen, aantrekkelijk voor invulrobots.
            '<div class="cf-exit__val" aria-hidden="true">' +
              '<label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label>' +
            '</div>' +
            '<p class="cf-exit__fout" data-cf="callback-fout" role="alert" hidden></p>' +
            '<button type="submit" class="cf-exit__btn cf-exit__btn--primary">' +
              t.callbackSend + '</button>' +
          '</form>' +
          '<p class="cf-exit__note">' + t.callbackNote + '</p>' +
        '</div>' +

        // Stap 4: bevestiging.
        '<div class="cf-exit__step" data-step="callback-ok" hidden>' +
          baken('goed') +
          '<h2 class="cf-exit__title">' + t.callbackOk + '</h2>' +
          '<p class="cf-exit__body">' + t.callbackOkBody + '</p>' +
        '</div>' +
      '</div>';

    return el;
  }

  /* --- Openen, sluiten, focus -------------------------------------------- */

  function focusables() {
    return Array.prototype.filter.call(
      root.querySelectorAll('a[href], button:not([disabled])'),
      function (node) { return node.offsetParent !== null; }
    );
  }

  function trapFocus(e) {
    if (e.key !== 'Tab') return;
    var items = focusables();
    if (!items.length) return;
    var first = items[0];
    var last = items[items.length - 1];

    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }

  function onKeydown(e) {
    if (e.key === 'Escape') {
      close('escape');
      return;
    }
    trapFocus(e);
  }

  // Toont de ene knop die bij het antwoord hoort, en verbergt de andere.
  //
  // Eerst schoven hier alleen knoppen van plek. Maar wie op "kosten" tikt en
  // dan alsnog een afspraakknop ziet, krijgt zijn eigen antwoord niet terug.
  // Dus: kosten leidt naar de kostenpagina, de rest naar een afspraak. Het
  // terugbelverzoek blijft altijd staan als uitweg.
  function kiesActie(reden) {
    if (!root) return;

    var rij = root.querySelector('[data-step="no"] [data-groep="hulp"]');
    if (!rij) return;

    var help = rij.querySelector('[data-cf="help"]');
    var afspraak = rij.querySelector('[data-cf="appointment"]');

    // Zonder kostenpagina valt er niets te kiezen.
    var wilHelp = 'kosten' === reden && help;

    if (help) help.hidden = !wilHelp;
    if (afspraak) afspraak.hidden = wilHelp;

    // De zichtbare knop is de hoofdknop; die draagt het accent.
    var zichtbaar = wilHelp ? help : afspraak;

    [help, afspraak].forEach(function (knop) {
      if (!knop) return;
      knop.classList.toggle('cf-exit__btn--primary', knop === zichtbaar);
      knop.classList.toggle('cf-exit__btn--ghost', knop !== zichtbaar);
    });

    if (zichtbaar) rij.insertBefore(zichtbaar, rij.firstChild);
  }

  function showStep(name) {
    // Onthouden waar de bezoeker is, zodat we bij het sluiten kunnen melden
    // welk scherm er stond. Zonder dat is "geen antwoord gegeven" één grote
    // bak waarin wegklikken en negeren niet te onderscheiden zijn.
    huidigeStap = name;

    Array.prototype.forEach.call(root.querySelectorAll('.cf-exit__step'), function (step) {
      var match = step.getAttribute('data-step') === name;
      if (match) {
        step.removeAttribute('hidden');
      } else {
        step.setAttribute('hidden', '');
      }
    });
    var target = root.querySelector('[data-step="' + name + '"] .cf-exit__btn');
    if (target) target.focus();
  }

  function open(trigger) {
    if (shown) return;
    shown = true;
    disarm();
    storageSet(STORAGE_KEY, String(Date.now()));

    // Altijd bij de vraag beginnen, ook als een vorige keer op een later
    // scherm geëindigd is.
    gekozenReden = '';
    showStep('ask');

    lastFocused = document.activeElement;
    root.removeAttribute('hidden');
    // Volgende frame, zodat de CSS-transitie daadwerkelijk afspeelt.
    requestAnimationFrame(function () {
      root.classList.add('is-open');
    });
    document.body.classList.add('cf-exit-lock');
    document.addEventListener('keydown', onKeydown, true);

    var firstBtn = root.querySelector('[data-step="ask"] .cf-exit__btn');
    if (firstBtn) firstBtn.focus();

    track('open', { trigger: trigger });
  }

  function close(reason) {
    root.classList.remove('is-open');
    document.body.classList.remove('cf-exit-lock');
    document.removeEventListener('keydown', onKeydown, true);

    window.setTimeout(function () {
      root.setAttribute('hidden', '');
    }, 220);

    if (lastFocused && typeof lastFocused.focus === 'function') {
      lastFocused.focus();
    }
    track('close', { reason: reason, step: huidigeStap });
  }

  /* --- Triggers ----------------------------------------------------------- */

  // Desktop: de muis verlaat het venster aan de bovenkant (richting tabbladen,
  // adresbalk of de sluitknop). relatedTarget is dan leeg.
  //
  // We wachten daarna nog exitGraceMs af. Wie naar het menu bovenaan reikt en
  // er net voorbij schiet, is binnen een fractie van een seconde weer terug -
  // en krijgt dus niets te zien. Wie echt weggaat, komt niet terug.
  function onMouseOut(e) {
    if (!armed || shown || exitTimer) return;
    if (e.relatedTarget || e.clientY > 0) return;

    if (!CONFIG.exitGraceMs) {
      open('mouseleave');
      return;
    }

    exitTimer = window.setTimeout(function () {
      exitTimer = null;
      open('mouseleave');
    }, CONFIG.exitGraceMs);
  }

  // De aanwijzer is terug in het venster: het was een valse start.
  function onMouseBack() {
    if (!exitTimer) return;

    window.clearTimeout(exitTimer);
    exitTimer = null;

    // Alleen voor de testpagina en eigen scripts; hier gaat niets naar de
    // server, want een valse start is geen gebeurtenis om te bewaren.
    try {
      window.dispatchEvent(new CustomEvent('cf-exit-popup', {
        detail: { action: 'valse-start', data: {} }
      }));
    } catch (e) {
      /* oude browsers: niet erg */
    }
  }

  // Mobiel: geen inactiviteit meer -> timer opnieuw starten.
  function resetIdle() {
    if (!armed || shown || !CONFIG.mobileIdleMs) return;
    window.clearTimeout(idleTimer);
    idleTimer = window.setTimeout(function () {
      open('idle');
    }, CONFIG.mobileIdleMs);
  }

  // Mobiel: snel omhoog scrollen richting de bovenkant is vaak een teken dat
  // iemand naar de adresbalk of terugknop gaat.
  var lastScrollY = 0;
  var lastScrollT = 0;
  function onScroll() {
    if (!armed || shown) return;
    var y = window.pageYOffset;
    var now = Date.now();
    var dt = now - lastScrollT;

    if (dt > 0 && dt < 500) {
      var speed = (lastScrollY - y) / dt; // pixels per ms, positief = omhoog
      if (speed > 1.2 && y < 300) {
        open('scroll-up');
      }
    }
    lastScrollY = y;
    lastScrollT = now;
    resetIdle();
  }

  // Wacht op het eerste teken van leven en zet daarna scherp. Zonder enige
  // interactie gebeurt er niets - zo blijven bezoekers die de pagina alleen
  // ophalen en verder niets doen buiten de metingen.
  var WAKE_EVENTS = ['mousemove', 'scroll', 'keydown', 'touchstart', 'click'];
  var stopWaiting = null;

  function armWhenInteracted() {
    function go() {
      stopWaiting();
      if (shown) return;
      arm();
    }

    stopWaiting = function () {
      WAKE_EVENTS.forEach(function (evt) {
        window.removeEventListener(evt, go, true);
      });
      stopWaiting = null;
    };

    WAKE_EVENTS.forEach(function (evt) {
      window.addEventListener(evt, go, { passive: true, capture: true });
    });
  }

  function arm() {
    armed = true;
    if (isTouchDevice()) {
      if (!CONFIG.enableMobile) return;
      ['touchstart', 'click', 'keydown'].forEach(function (evt) {
        document.addEventListener(evt, resetIdle, { passive: true });
      });
      window.addEventListener('scroll', onScroll, { passive: true });
      resetIdle();
    } else {
      document.addEventListener('mouseout', onMouseOut);
      // mouseover vuurt zodra de aanwijzer weer boven de pagina komt.
      document.addEventListener('mouseover', onMouseBack);
    }
  }

  function disarm() {
    armed = false;
    if (stopWaiting) stopWaiting();
    window.clearTimeout(idleTimer);
    window.clearTimeout(exitTimer);
    exitTimer = null;
    document.removeEventListener('mouseout', onMouseOut);
    document.removeEventListener('mouseover', onMouseBack);
    window.removeEventListener('scroll', onScroll);
    ['touchstart', 'click', 'keydown'].forEach(function (evt) {
      document.removeEventListener(evt, resetIdle);
    });
  }

  /* --- Start -------------------------------------------------------------- */

  // Verstuurt het terugbelverzoek.
  //
  // Hier gebruiken we bewust géén sendBeacon: dat vertelt niet of het gelukt
  // is, en juist hier moet de bezoeker een bevestiging krijgen. Iemand die zijn
  // nummer achterlaat en niets terugziet, gaat ervan uit dat het mislukt is.
  function verstuurTerugbelverzoek(form) {
    if (bezigMetVersturen) return;

    var foutvak = root.querySelector('[data-cf="callback-fout"]');
    var knop = form.querySelector('button[type="submit"]');

    function toonFout(bericht) {
      if (!foutvak) return;
      foutvak.textContent = bericht;
      foutvak.hidden = false;
    }

    if (foutvak) foutvak.hidden = true;

    var naam = String(form.naam.value || '').trim();
    var telefoon = String(form.telefoon.value || '').trim();

    if (!naam || !telefoon) {
      toonFout(CONFIG.text.callbackError);
      return;
    }

    if (!SETTINGS.callbackEndpoint) {
      // Buiten WordPress (demo, testpagina) is er niets om naartoe te sturen.
      showStep('callback-ok');
      return;
    }

    bezigMetVersturen = true;
    if (knop) knop.disabled = true;

    window.fetch(SETTINGS.callbackEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: naam,
        phone: telefoon,
        website: String(form.website.value || ''),
        elapsed: formulierGeopendOp ? Date.now() - formulierGeopendOp : 0,
        reason: gekozenReden,
        page: window.location.pathname
      })
    }).then(function (antwoord) {
      bezigMetVersturen = false;
      if (knop) knop.disabled = false;

      if (antwoord.ok || 204 === antwoord.status) {
        track('callback', { reason: gekozenReden });
        showStep('callback-ok');
        return;
      }

      toonFout(CONFIG.text.callbackError);
    }).catch(function () {
      bezigMetVersturen = false;
      if (knop) knop.disabled = false;
      toonFout(CONFIG.text.callbackError);
    });
  }

  function bindUi() {
    root.addEventListener('submit', function (e) {
      var form = e.target.closest ? e.target.closest('[data-cf="callback-form"]') : null;
      if (!form) return;
      e.preventDefault();
      verstuurTerugbelverzoek(form);
    });

    root.addEventListener('click', function (e) {
      var el = e.target.closest ? e.target.closest('[data-cf]') : null;
      if (!el) return;
      var action = el.getAttribute('data-cf');

      switch (action) {
        case 'overlay':
        case 'close':
          close(action);
          break;
        case 'answer-yes':
          track('answer', { answer: 'ja' });
          showStep('yes');
          break;
        case 'answer-no':
          track('answer', { answer: 'nee' });
          showStep('reason');
          break;
        case 'reason':
          gekozenReden = el.getAttribute('data-reason') || 'anders';
          track('reason', { reason: gekozenReden });
          kiesActie(gekozenReden);
          showStep('no');
          break;
        case 'call':
          track('call', { number: CONFIG.phoneHref });
          break;
        case 'whatsapp':
          track('whatsapp', {});
          break;
        case 'help':
          track('help', {});
          break;
        case 'callback-open':
          formulierGeopendOp = Date.now();
          track('callback-open', {});
          showStep('callback');
          var eersteVeld = root.querySelector('[data-step="callback"] input[name="naam"]');
          if (eersteVeld) eersteVeld.focus();
          break;
        case 'appointment':
          track('appointment', {});
          break;
      }
    });
  }

  function init() {
    // Debug-modus: zet ?cf-popup=test in de URL om de cooldown te negeren en
    // de pop-up direct te kunnen testen.
    var testMode = window.location.search.indexOf('cf-popup=test') !== -1;

    if (!testMode) {
      if (inCooldown() || onExcludedPage()) return;
    }
    if (isTouchDevice() && !CONFIG.enableMobile) return;

    // Bezoek tellen voordat we de pop-up opbouwen, zodat de tekst meteen bij
    // het juiste soort bezoeker past.
    visitCount = countVisit();

    root = buildMarkup();
    document.body.appendChild(root);
    bindUi();

    if (testMode) {
      window.setTimeout(function () { open('test'); }, 500);
      return;
    }

    window.setTimeout(
      CONFIG.requireInteraction ? armWhenInteracted : arm,
      CONFIG.armAfterMs
    );
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // Kleine publieke ingang, handig om te testen of om de pop-up aan een eigen
  // knop te hangen:
  //
  //   cfExitPopup.toon();     - toon hem meteen
  //   cfExitPopup.vergeet();  - wis het "al getoond"-geheugen
  window.cfExitPopup = {
    toon: function () {
      if (!root) {
        // init() kan eerder afgehaakt zijn - bij een lopende rustperiode of op
        // een uitgesloten pagina - en dan is het bezoek nog niet geteld. Zonder
        // deze regel wordt het venster opgebouwd alsof iedereen nieuw is, en
        // krijgt een terugkerende bezoeker de verkeerde tekst.
        visitCount = countVisit();
        root = buildMarkup();
        document.body.appendChild(root);
        bindUi();
      }
      shown = false;
      open('handmatig');
    },
    vergeet: function () {
      try {
        window.localStorage.removeItem(STORAGE_KEY);
      } catch (e) {
        /* niets aan te doen */
      }

      // "Vergeten" betekent ook dat de pop-up weer mag verschijnen, dus zetten
      // we de herkenning opnieuw scherp. Zonder dit blijft hij na één keer
      // tonen definitief uit.
      shown = false;
      disarm();
      arm();
    }
  };
})();
</script>
